<meta property="og:url" content="https://kt247240.github.io/an0n-portfolio/">

<body data-scene="forest">

<div id="loader" aria-hidden="true">
  <div class="loader-inner">
    <p class="loader-sig">An0n.</p>
    
  </div>
</div>

<header id="site-head">
  <a class="brand" href="#entrance" aria-label="An0n. 森の美術館 トップへ"><span class="sig">An0n.</span><small>森の美術館</small></a>
  <button id="beat" class="beat" aria-pressed="false" aria-label="ビートを流す"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lbl"></span></button>
  <nav class="head-links" aria-label="メニュー"><a href="#catalog" aria-label="収蔵目録"><svg viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg></a><a href="#artist" aria-label="作家"><svg viewBox="0 0 20 20"><path d="M10 2C6.4 2 5 5 5 8c0 3.4 2 5.6 5 5.6s5-2.2 5-5.6C15 5 13.6 2 10 2Z"/><path d="M7 7.4q1.4-1.2 2.6 0q-1.2 1.2-2.6 0ZM10.4 7.4q1.4-1.2 2.6 0q-1.2 1.2-2.6 0Z" fill="#df7418"/><path d="M3 20c.6-3.6 3.4-5.4 7-5.4s6.4 1.8 7 5.4Z"/></svg></a></nav>
</header>
<nav id="room-nav" aria-label="展示室"></nav>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <!-- 入口：森の中の美術館へ -->
  <section id="entrance" aria-label="入口">
    <div class="sticky">
      <div class="sky"></div>
      <div class="plane far"></div>
      <div class="plane mid"></div>
      <svg class="sign" viewBox="0 0 60 70" data-egg="sign" role="img" aria-label="An0n. 森の美術館はこの先">
        <path d="M27.4 28L26.6 70H33.4L32.6 28Z" fill="#6b4a2e"/><path d="M30.6 28L31 70H33.4L32.6 28Z" fill="#553a23"/>
        <path d="M4 10L46 6L56 17L46 29L4 31Z" fill="#8f602e"/><path d="M4 10L46 6L56 17L4 19Z" fill="#a8764a"/>
        <path d="M9 13L40 10.6V26.6L9 27.6Z" fill="#f4e6c8"/>
        <text x="24.6" y="23.4" text-anchor="middle" transform="rotate(-4.4 24.6 19)" font-family="Yellowtail, Allura, 'Brush Script MT', cursive" font-size="11.5" fill="#3b2a1c">An0n.</text>
        <path d="M9 13L40 10.6V26.6L9 27.6Z" fill="none" stroke="#6b4630" stroke-width="1.2"/>
        <circle cx="47.6" cy="17.4" r="1.4" fill="#df7418"/>
        <path d="M18 70Q24 64 30 68Q36 63 44 70Z" fill="#47733c"/>
      </svg>
      <button id="boombox" class="boombox-btn" aria-label="ラジカセ：ビートを流す"></button>
      <div class="guide"><span class="walker" role="img" aria-label="森の奥へ歩いていく、バラクラバをかぶった案内人"></span></div>
      <div class="frame"></div>
      <div class="curtain" aria-hidden="true"></div>
      <p class="scroll-cue" aria-label="スクロール"><i></i></p>
      <div class="veil"></div>
    </div>
  </section>

  <!-- 展示室（assets/js/works.js から組み立て） -->
  <div id="rooms"></div>

  <!-- 収蔵目録 -->
  <section id="catalog" aria-label="収蔵目録">
    <div id="catalog-grid"></div>
  </section>

  <!-- 作家について -->
  <section id="artist" aria-label="作家について">
    <div class="reveal-up">
      
      <div id="artist-links"></div>
    </div>
  </section>
</main>
<footer><span>© 2026 @he024mp</span></footer>

<!-- 作品の中へ：没入ビューア -->
<div id="viewer" role="dialog" aria-modal="true" aria-label="作品を大きく見る" aria-hidden="true" data-scene="forest">
  <canvas id="v-wash" width="48" height="27"></canvas>
  <div class="v-stage"><div id="v-space">
    <canvas class="v-wall left" width="320" height="180"></canvas>
    <canvas class="v-wall right" width="320" height="180"></canvas>
    <canvas class="v-floor" width="320" height="180"></canvas>
    <figure id="v-screen"></figure>
  </div></div>
  <canvas id="v-fx"></canvas>
  <div class="v-vignette"></div>
  <div class="v-ui">
    <div class="v-top"><span class="sig">An0n.</span><button id="v-close" aria-label="森へ戻る">×</button></div>
    <div class="v-cap"><p id="v-meta"></p></div>
    <div class="v-nav"><button id="v-prev" aria-label="前の作品">←</button><button id="v-next" aria-label="次の作品">→</button></div>
  </div>
</div>

<div id="progress"></div>
<div id="grain" aria-hidden="true"></div>
<script type="module" src="assets/js/museum.js"></script>
</body>
</html>
